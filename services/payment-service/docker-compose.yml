services:

  postgres:
    image: postgres:16
    container_name: ecommerce-payment-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_db

    ports:
      - "5435:5432"

    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

volumes:
  payment_postgres_data: