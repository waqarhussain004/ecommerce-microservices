services:

  postgres:
    image: postgres:16
    container_name: ecommerce-product-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: product_db

    ports:
      - "5433:5432"

    volumes:
      - product_postgres_data:/var/lib/postgresql/data

volumes:
  product_postgres_data: